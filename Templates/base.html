<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}My Site{% endblock %}</title>
  </head>
  <body>
    {% if messages %}
      <ul>
        {% for m in messages %}
          <li>{{ m }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% if user.is_authenticated %}
      <p>Hi {{ user.username }} |
        <form action="{% url 'logout' %}" method="post" style="display: inline;">
          {% csrf_token %}
          <button type="submit" class="link-button">Logout</button>
        </form>
    {% endif %}

    {% block content %}{% endblock %}
  </body>
</html>
