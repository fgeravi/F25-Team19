{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
  <h1>Home</h1>
  {% if user.is_authenticated %}
    <p>Welcome {{ user.username }}</p>
  {% else %}
    <p><a href="{% url 'login' %}">Login</a></p>
  {% endif %}
  <a href="{% url 'rewards:dashboard' %}" class="btn btn-primary btn-lg">
    View My Points Dashboard
</a>
{% endblock %}
