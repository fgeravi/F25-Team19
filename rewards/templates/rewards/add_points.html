{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Award Points to a Driver</h1>
    <hr>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group mb-3">
            <label for="driver">Select Driver</label>
            <select name="driver" id="driver" class="form-control" required>
                <option value="">--- Choose a Driver ---</option>
                {% for driver in drivers %}
                    <option value="{{ driver.id }}">{{ driver.username }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group mb-3">
            <label for="points">Points to Award</label>
            <input type="number" name="points" id="points" class="form-control" required>
        </div>

        <div class="form-group mb-3">
            <label for="reason">Reason (Optional)</label>
            <input type="text" name="reason" id="reason" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Award Points</button>
    </form>
</div>
{% endblock %}
