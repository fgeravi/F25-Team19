{# templates/partials/download_csv_button.html #}
{% with qs=request.GET.urlencode %}
  {% if url_name %}
    {% url url_name as csv_url %}
  {% else %}
    {% url 'export_applications_csv' as csv_url %} {# default to applications CSV #}
  {% endif %}
  <a class="btn btn-outline-primary"
     href="{{ csv_url }}{% if qs %}?{{ qs }}{% endif %}">
    {{ label|default:"Download CSV" }}
  </a>
{% endwith %}
