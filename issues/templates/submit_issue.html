{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Report an Issue</h1>
    <p>If you've encountered a technical problem or have an issue with your account, please let us know below.</p>
    <hr>
    
    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary mt-3">Submit Report</button>
        <a href="{% url 'home' %}" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>
{% endblock %}
