{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* ---------------- LAYOUT ---------------- */
    .reports-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px 40px;
    }
    .report-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
    }
    .report-title {
        font-size: 2.2rem;
        font-weight: 700;
        margin: 0;
        color: #e7eef3; /* var(--text) */
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* ---------------- FILTER PANEL ---------------- */
    .filter-panel {
        background: rgba(21, 24, 27, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 40px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-end;
    }
    .filter-group {
        flex: 1;
        min-width: 200px;
    }
    .filter-group label {
        display: block;
        margin-bottom: 10px;
        color: #a8b3bd; /* var(--text-dim) */
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }
    /* Form inputs */
    .filter-group input, 
    .filter-group select {
        width: 100%;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: #e7eef3;
        font-size: 1rem;
    }

    /* ---------------- TABLES (The Fix for "Mashed" look) ---------------- */
    .table-responsive {
        overflow-x: auto;
        border-radius: 16px;
        background: rgba(21, 24, 27, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    .report-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        color: #e7eef3;
        font-size: 0.95rem;
    }
    /* Headers */
    .report-table th {
        background: rgba(255, 255, 255, 0.03);
        color: #a8b3bd;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        font-size: 0.75rem;
        padding: 20px 24px; /* Generous padding */
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        white-space: nowrap;
    }
    /* Body Cells */
    .report-table td {
        padding: 20px 24px; /* Generous padding */
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        vertical-align: middle;
    }
    .report-table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.03);
    }
    .report-table tbody tr:last-child td {
        border-bottom: none;
    }

    /* ---------------- VALUES & BADGES ---------------- */
    .val-pos { 
        color: #4ade80; 
        font-weight: 600; 
        background: rgba(74, 222, 128, 0.1);
        padding: 4px 8px;
        border-radius: 6px;
    }
    .val-neg { 
        color: #f87171; 
        font-weight: 600; 
        background: rgba(248, 113, 113, 0.1);
        padding: 4px 8px;
        border-radius: 6px;
    }
    .val-money { 
        font-family: monospace; 
        letter-spacing: -0.5px; 
        font-weight: bold; 
    }

    /* ---------------- DASHBOARD GRID ---------------- */
    .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 30px;
        margin-top: 20px;
    }
    .dashboard-card {
        background: rgba(30, 35, 40, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 32px;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .dashboard-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .dashboard-card h3 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #e7eef3;
        margin-bottom: 12px;
    }
    .report-links {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 24px;
    }

    @media print {
        .home-aurora, body { background: white !important; color: black !important; }
        .dashboard-card, .filter-panel, .table-responsive {
            background: white !important;
            border: 1px solid #ccc !important;
            box-shadow: none !important;
        }
        .report-title, h3, th, td { color: black !important; text-shadow: none !important; }
        .report-header a, .filter-panel, .btn-pill, .points-badge { display: none !important; } /* Hide buttons/forms */
        .report-table th { background-color: #f0f0f0 !important; color: black !important; border-bottom: 2px solid #000 !important; }
        .report-table td { border-bottom: 1px solid #ddd !important; }
        
        /* Ensure the invoice table expands fully */
        .reports-container { max-width: 100% !important; padding: 0 !important; }
    }
</style>

<div class="home-aurora" style="min-height: 100vh; padding-bottom: 40px;">
    <div class="reports-container">
        
        <!-- Header: Title + Back Button -->
        <div class="report-header">
            <h1 class="report-title">{% block report_title %}Reports{% endblock %}</h1>
            <a href="{% url 'reports:index' %}" class="btn-pill btn-outline">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </div>

        <!-- Filter Panel (Only renders if a form is present in the view) -->
        {% if form %}
        <div class="filter-panel">
            <form method="get" class="filter-row">
                {% for field in form %}
                <div class="filter-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                
                <div class="filter-group" style="flex: 0 0 auto; padding-bottom: 1px;">
                    <div class="actions-stack" style="margin:0; display:flex; gap:10px;">
                        <button type="submit" class="btn-pill btn-pill--active">
                            Apply Filters
                        </button>
                        <button type="submit" name="download_csv" value="1" class="btn-pill btn-outline">
                            <i class="fas fa-download"></i> CSV
                        </button>
                    </div>
                </div>
            </form>
        </div>
        {% endif %}

        <!-- Specific Report Content Injected Here -->
        {% block report_content %}
        {% endblock %}
        
    </div>
</div>
{% endblock %}
