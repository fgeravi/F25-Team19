{% load static %}
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Reset your password</title></head>
<body>
  <h1>Forgot your password?</h1>
  <p>Enter the email you use to sign in. We’ll send a reset link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.errors }}
    <label>Email</label>
    {{ form.email }}
    <button type="submit">Send reset link</button>
  </form>
  <p><a href="{% url 'login' %}">Back to login</a></p>
</body>
</html>
