{% extends "base.html" %}
{% block title %}Password reset sent{% endblock %}

{% block content %}
<main id="content" class="auth-wrap">
  <section class="auth-card">
    <h1 class="auth-title">Check your email</h1>
    <p class="auth-subtitle">
      If an account exists with that email address, you’ll receive a message with a link to reset your password.
    </p>

    <p style="margin-top: 1rem;">
      <a href="{% url 'login' %}">Return to login</a>
    </p>
  </section>
</main>
{% endblock %}
