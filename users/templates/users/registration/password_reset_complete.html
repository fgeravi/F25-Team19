{% extends "base.html" %}
{% block title %}Password changed{% endblock %}

{% block content %}
<main id="content" class="auth-wrap">
  <section class="auth-card">
    <h1 class="auth-title">Password updated</h1>
    <p class="auth-subtitle">
      Your password has been set. You can now log in with your new credentials.
    </p>

    <p style="margin-top: 1rem;">
      <a href="{% url 'login' %}" class="btn-auth btn-auth-lg">Go to login</a>
    </p>
  </section>
</main>
{% endblock %}
