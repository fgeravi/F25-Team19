{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<main id="content" class="auth-wrap">
  <section class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue</p>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Email or Username</label>
        <input type="text" name="username" id="id_username" required autofocus
               value="{{ form.username.value|default_if_none:'' }}">
      </div>

      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required>
      </div>

      {% if form.remember_me %}
      <div class="form-row-between">
        <label class="checkbox">
          {{ form.remember_me }} Keep me signed in
        </label>
      </div>
      {% endif %}

      {% if message %}
        <div class="alert alert-warning" style="margin-top:8px;">{{ message }}</div>
      {% endif %}

      <button type="submit" class="btn-auth btn-auth-lg">Sign in</button>
    </form>

    <div class="auth-links">
      <a href="{% url 'register' %}">Create account</a>
      <span>•</span>
      <a href="/admin/">Admin</a>
    </div>
  </section>
</main>
{% endblock %}
